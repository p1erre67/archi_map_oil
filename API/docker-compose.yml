services:
  postgres:
    image: postgres:16
    container_name: pricewatch-db
    environment:
      POSTGRES_DB: pricewatch
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: gescar
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  api:
    build:
      context: .
      dockerfile: src/PriceWatch.Api/Dockerfile
    container_name: pricewatch-api
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ConnectionStrings__PriceWatch=Host=postgres;Port=5432;Database=pricewatch;Username=postgres;Password=gescar
    ports:
      - "5000:8080"
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  postgres_data:
