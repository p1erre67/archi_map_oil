services:
  mariadb:
    image: mariadb:11.4
    container_name: pricewatch-db
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: pricewatch
      MYSQL_USER: pricewatch
      MYSQL_PASSWORD: pricewatch
    ports:
      - "3306:3306"
    volumes:
      - mariadb_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 10s
      timeout: 5s
      retries: 5

  api:
    build:
      context: .
      dockerfile: src/PriceWatch.Api/Dockerfile
    container_name: pricewatch-api
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ConnectionStrings__PriceWatch=Server=mariadb;Port=3306;Database=pricewatch;User=pricewatch;Password=pricewatch;
    ports:
      - "5000:8080"
    depends_on:
      mariadb:
        condition: service_healthy

volumes:
  mariadb_data:
