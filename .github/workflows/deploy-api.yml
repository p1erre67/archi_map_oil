name: Deploy API

# Se déclenche au push sur master quand un fichier dans API/ change.
# Build l'image Docker, la push vers GitHub Container Registry (GHCR),
# puis met à jour la Container App Azure.

on:
  push:
    branches: [master]
    paths:
      - "API/**"
  workflow_dispatch: # Déclenchement manuel possible

env:
  IMAGE: ghcr.io/${{ github.repository_owner }}/pricewatch-api

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Restore dependencies
        working-directory: API
        run: dotnet restore

      - name: Build
        working-directory: API
        run: dotnet build --no-restore

      - name: Run unit and architecture tests
        working-directory: API
        run: dotnet test --no-build --filter "FullyQualifiedName~UnitTests|FullyQualifiedName~ArchitectureTests"

      - name: Run integration tests (Testcontainers Postgres)
        working-directory: API
        run: dotnet test --no-build --filter "FullyQualifiedName~IntegrationTests"

  deploy:
    runs-on: ubuntu-latest
    needs: test
    permissions:
      packages: write # nécessaire pour push vers GHCR

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Login to GHCR
        run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin

      - name: Build and push Docker image
        working-directory: API
        run: |
          docker build -t ${{ env.IMAGE }}:${{ github.sha }} \
                       -t ${{ env.IMAGE }}:latest \
                       -f src/PriceWatch.Api/Dockerfile .
          docker push ${{ env.IMAGE }} --all-tags

      - name: Login to Azure
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Deploy to Azure Container Apps
        run: |
          az containerapp update \
            --name pricewatch-api \
            --resource-group pricewatch-rg \
            --image ${{ env.IMAGE }}:${{ github.sha }}
