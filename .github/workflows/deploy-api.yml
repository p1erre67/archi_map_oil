name: Deploy API

# Se déclenche au push sur master quand un fichier dans API/ change.
# Build l'image Docker, la push vers Azure Container Registry,
# puis met à jour la Container App.

on:
  push:
    branches: [master]
    paths:
      - "API/**"
  workflow_dispatch: # Déclenchement manuel possible

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Restore dependencies
        working-directory: API
        run: dotnet restore

      - name: Build
        working-directory: API
        run: dotnet build --no-restore

      - name: Run unit and architecture tests
        working-directory: API
        run: dotnet test --no-build --filter "FullyQualifiedName~UnitTests|FullyQualifiedName~ArchitectureTests"

      - name: Run integration tests (Testcontainers Postgres)
        working-directory: API
        run: dotnet test --no-build --filter "FullyQualifiedName~IntegrationTests"

  deploy:
    runs-on: ubuntu-latest
    needs: test

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Login to Azure
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Login to ACR
        run: az acr login --name ${{ secrets.ACR_NAME }}

      - name: Build and push Docker image
        working-directory: API
        run: |
          docker build -t ${{ secrets.ACR_NAME }}.azurecr.io/pricewatch-api:${{ github.sha }} \
                       -t ${{ secrets.ACR_NAME }}.azurecr.io/pricewatch-api:latest \
                       -f src/PriceWatch.Api/Dockerfile .
          docker push ${{ secrets.ACR_NAME }}.azurecr.io/pricewatch-api --all-tags

      - name: Deploy to Azure Container Apps
        run: |
          az containerapp update \
            --name pricewatch-api \
            --resource-group pricewatch-rg \
            --image ${{ secrets.ACR_NAME }}.azurecr.io/pricewatch-api:${{ github.sha }}
